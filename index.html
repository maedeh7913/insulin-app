<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Dina Smart Cap</title>

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600;700&display=swap" rel="stylesheet">

  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
      font-family: 'Inter', sans-serif;
    }

    body {
      background: linear-gradient(135deg, #0f172a, #020617);
      color: white;
      min-height: 100vh;
      padding: 20px;
      overflow-x: hidden;
    }

    .container {
      max-width: 1400px;
      margin: auto;
    }

    .topbar {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 30px;
      flex-wrap: wrap;
      gap: 20px;
    }

    .title h1 {
      font-size: 2rem;
      font-weight: 700;
    }

    .title p {
      color: #94a3b8;
      margin-top: 6px;
    }

    .connection {
      display: flex;
      align-items: center;
      gap: 10px;
      background: rgba(255,255,255,0.05);
      padding: 12px 18px;
      border-radius: 16px;
      border: 1px solid rgba(255,255,255,0.08);
    }

    .status-dot {
      width: 14px;
      height: 14px;
      border-radius: 50%;
      background: #ef4444;
      box-shadow: 0 0 15px #ef4444;
    }

    .dashboard {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(260px, 1fr));
      gap: 20px;
      margin-bottom: 30px;
    }

    .card {
      background: rgba(255,255,255,0.06);
      border: 1px solid rgba(255,255,255,0.08);
      border-radius: 24px;
      padding: 24px;
      backdrop-filter: blur(20px);
      box-shadow: 0 10px 30px rgba(0,0,0,0.3);
      transition: 0.3s ease;
    }

    .card:hover {
      transform: translateY(-5px);
    }

    .card-title {
      color: #94a3b8;
      margin-bottom: 15px;
      font-size: 0.95rem;
    }

    .big-number {
      font-size: 3rem;
      font-weight: 700;
    }

    .unit {
      color: #94a3b8;
      font-size: 1rem;
    }

    .status-card {
      text-align: center;
    }

    .status-text {
      font-size: 1.6rem;
      font-weight: 600;
      margin-top: 20px;
    }

    .led-container {
      display: flex;
      justify-content: center;
      align-items: center;
      margin-top: 10px;
    }

    .led {
      width: 90px;
      height: 90px;
      border-radius: 50%;
      background: gray;
      box-shadow: 0 0 40px gray;
      transition: 0.3s ease;
    }

    .controls {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(220px, 1fr));
      gap: 15px;
      margin-bottom: 30px;
    }

    button {
      border: none;
      border-radius: 18px;
      padding: 16px;
      font-size: 1rem;
      font-weight: 600;
      cursor: pointer;
      transition: 0.25s ease;
      background: #1e293b;
      color: white;
    }

    button:hover {
      transform: scale(1.03);
    }

    .blue {
      background: #2563eb;
    }

    .green {
      background: #16a34a;
    }

    .red {
      background: #dc2626;
    }

    .orange {
      background: #ea580c;
    }

    .chart-card {
      margin-bottom: 30px;
    }

    canvas {
      width: 100% !important;
      max-height: 380px;
    }

    .logs {
      background: rgba(255,255,255,0.06);
      border-radius: 24px;
      padding: 20px;
      border: 1px solid rgba(255,255,255,0.08);
    }

    .logs h2 {
      margin-bottom: 15px;
    }

    .log-item {
      padding: 14px;
      border-bottom: 1px solid rgba(255,255,255,0.06);
      color: #cbd5e1;
    }

    .injecting {
      animation: pulse 1s infinite;
    }

    @keyframes pulse {
      0% { transform: scale(1); }
      50% { transform: scale(1.08); }
      100% { transform: scale(1); }
    }

    @media(max-width:768px){
      .big-number {
        font-size: 2.3rem;
      }

      .status-text {
        font-size: 1.2rem;
      }
    }
  </style>
</head>
<body>

<div class="container">

  <div class="topbar">
    <div class="title">
      <h1>Dina Smart Cap</h1>
      <p>Real-Time Injection Monitoring System</p>
    </div>

    <div class="connection">
      <div class="status-dot" id="statusDot"></div>
      <span id="connectionText">Disconnected</span>
    </div>
  </div>

  <div class="dashboard">

    <div class="card">
      <div class="card-title">Yaw Angle</div>
      <div class="big-number" id="yawValue">0°</div>
      <div class="unit">Current Rotation</div>
    </div>

    <div class="card">
      <div class="card-title">Dose</div>
      <div class="big-number" id="doseValue">0</div>
      <div class="unit">Units</div>
    </div>

    <div class="card">
      <div class="card-title">Injection Timer</div>
      <div class="big-number" id="timerValue">0s</div>
      <div class="unit">Elapsed Time</div>
    </div>

    <div class="card status-card">
      <div class="card-title">System Status</div>

      <div class="led-container">
        <div class="led" id="led"></div>
      </div>

      <div class="status-text" id="statusText">
        Waiting...
      </div>
    </div>

  </div>

  <div class="controls">
    <button class="blue" onclick="connectSystem()">Connect Device</button>

    <button onclick="simulateDoseIncrease()">
      Simulate Dose Rotation
    </button>

    <button class="orange" onclick="startInjection()">
      Start Injection
    </button>

    <button class="green" onclick="completeInjection()">
      Complete Injection
    </button>

    <button class="red" onclick="failInjection()">
      Fail Injection
    </button>

    <button onclick="resetSystem()">
      Reset System
    </button>
  </div>

  <div class="card chart-card">
    <div class="card-title">Injection Dose History</div>
    <canvas id="doseChart"></canvas>
  </div>

  <div class="logs">
    <h2>System Logs</h2>
    <div id="logsContainer"></div>
  </div>

</div>

<script src="https://cdn.jsdelivr.net/npm/chart.js"></script>

<script>

let yaw = 0;
let dose = 0;
let timer = 0;
let timerInterval;
let connected = false;

const yawValue = document.getElementById('yawValue');
const doseValue = document.getElementById('doseValue');
const timerValue = document.getElementById('timerValue');
const statusText = document.getElementById('statusText');
const led = document.getElementById('led');
const logsContainer = document.getElementById('logsContainer');
const statusDot = document.getElementById('statusDot');
const connectionText = document.getElementById('connectionText');

function addLog(message){
  const item = document.createElement('div');
  item.className = 'log-item';

  const now = new Date().toLocaleTimeString();

  item.innerHTML = `[${now}] ${message}`;

  logsContainer.prepend(item);
}

function setLED(color){
  led.style.background = color;
  led.style.boxShadow = `0 0 40px ${color}`;
}

function connectSystem(){
  connected = true;

  statusDot.style.background = '#22c55e';
  statusDot.style.boxShadow = '0 0 15px #22c55e';

  connectionText.innerText = 'Connected';

  setLED('#2563eb');

  statusText.innerText = 'Dina Ready';

  addLog('Device connected successfully');
}

function simulateDoseIncrease(){
  yaw += 15;
  dose += 1;

  yawValue.innerText = yaw + '°';
  doseValue.innerText = dose;

  statusText.innerText = 'Dose Adjusting';

  addLog(`Dose increased to ${dose} units`);
}

function startInjection(){

  if(!connected){
    alert('Connect device first');
    return;
  }

  statusText.innerText = 'Injecting...';

  statusText.classList.add('injecting');

  setLED('#f59e0b');

  addLog('Injection started');

  timer = 0;

  clearInterval(timerInterval);

  timerInterval = setInterval(() => {
    timer++;
    timerValue.innerText = timer + 's';
  },1000);
}

function completeInjection(){

  clearInterval(timerInterval);

  statusText.classList.remove('injecting');

  statusText.innerText = 'Injection Completed';

  setLED('#22c55e');

  addLog(`Injection completed successfully (${dose} units)`);

  addDoseToChart(dose);

  yaw = 0;
  dose = 0;

  yawValue.innerText = '0°';
  doseValue.innerText = '0';
}

function failInjection(){

  clearInterval(timerInterval);

  statusText.classList.remove('injecting');

  statusText.innerText = 'Injection Failed';

  setLED('#ef4444');

  addLog('Injection failed');
}

function resetSystem(){

  clearInterval(timerInterval);

  yaw = 0;
  dose = 0;
  timer = 0;

  yawValue.innerText = '0°';
  doseValue.innerText = '0';
  timerValue.innerText = '0s';

  statusText.innerText = 'Waiting...';

  statusText.classList.remove('injecting');

  setLED('gray');

  addLog('System reset');
}

const ctx = document.getElementById('doseChart');

const doseChart = new Chart(ctx, {
  type: 'line',
  data: {
    labels: [],
    datasets: [{
      label: 'Dose Units',
      data: [],
      borderColor: '#3b82f6',
      backgroundColor: 'rgba(59,130,246,0.2)',
      tension: 0.4,
      fill: true
    }]
  },
  options: {
    responsive: true,
    plugins: {
      legend: {
        labels: {
          color: 'white'
        }
      }
    },
    scales: {
      x: {
        ticks: {
          color: 'white'
        }
      },
      y: {
        ticks: {
          color: 'white'
        }
      }
    }
  }
});

function addDoseToChart(doseValueChart){

  const time = new Date().toLocaleTimeString();

  doseChart.data.labels.push(time);
  doseChart.data.datasets[0].data.push(doseValueChart);

  doseChart.update();
}

addLog('System initialized');

</script>

</body>
</html>
